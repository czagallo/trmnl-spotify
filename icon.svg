<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DB954"/>
      <stop offset="100%" stop-color="#169C46"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="url(#bg)"/>

  <!-- Sound waves (Spotify-inspired arcs) -->
  <g transform="translate(100, 105)" fill="none" stroke="white" stroke-linecap="round">
    <path d="M-52,-38 C-20,-52 20,-52 52,-38" stroke-width="10"/>
    <path d="M-40,-16 C-16,-28 16,-28 40,-16" stroke-width="10"/>
    <path d="M-26,6 C-10,-4 10,-4 26,6" stroke-width="10"/>
  </g>

  <!-- Circle dot at bottom -->
  <circle cx="100" cy="130" r="8" fill="white"/>
</svg>
